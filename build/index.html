rsor:pointer;transition:border .18s,background .18s;display:block}.upload-box:hover{border-color:var(--primary);background:var(--primary-50)}.upload-icon{font-size:42px;margin-bottom:10px}.mode-tabs{display:flex;gap:8px;margin-bottom:14px}.mode-tab{flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--text-2);transition:.15s}.mode-tab.active{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}.alert-error{background:var(--red-50);border:1px solid #fecaca;color:var(--red);padding:11px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;font-weight:500}.actions{display:flex;gap:6px}.footer{text-align:center;color:var(--text-3);font-size:13px;margin-top:24px;padding-bottom:28px}@media (max-width:640px){.header{padding:11px 14px;gap:8px}.header h1{font-size:17px}.brand-mark{width:36px;height:36px;font-size:19px}.header .sub{display:none}.header-btns{gap:6px}.nav-btn{padding:6px 9px;font-size:11px;gap:3px}.main{padding:12px 10px}.card{padding:16px}.card-title{font-size:15px}.stat-row{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{padding:13px;gap:11px}.stat-ic{width:40px;height:40px;font-size:19px}.stat-num{font-size:20px}.form-row-5a{grid-template-columns:1fr 1fr}.form-row-6a{grid-template-columns:1fr 1fr}.form-row-5b{grid-template-columns:1fr 1fr}.form-row-2{grid-template-columns:1fr}.toggle-row{gap:6px}.search-wrap{min-width:120px}td,th{padding:9px 10px;font-size:12px}}</style><script defer="defer" src="/static/js/main.8b9fe7fe.js"></script><link href="/static/css/main.78c44df1.css" rel="stylesheet"></head><body><noscript>You need to enable JavaScript to run this app.</noscript><div id="root"></div></body></html>
