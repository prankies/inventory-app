<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Inventory management system" />
    <title>Inventory Hub</title>
    <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  font-size: 15px;
}

/* Header */
.header {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  padding: 14px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.header h1 { font-size: 22px; font-weight: 700; }
.header p { font-size: 12px; opacity: 0.8; }
.header-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* Buttons */
.btn {
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.88; }
.btn-blue   { background: #2563eb; color: white; }
.btn-green  { background: #16a34a; color: white; }
.btn-red    { background: #dc2626; color: white; }
.btn-purple { background: #7c3aed; color: white; }
.btn-orange { background: #ea580c; color: white; }
.btn-gray   { background: #6b7280; color: white; }
.btn-light  { background: #e2e8f0; color: #1e293b; }
.btn-sm     { padding: 5px 10px; font-size: 12px; }
.btn:disabled { background: #94a3b8; cursor: not-allowed; }

/* Login */
.login-wrap {
  min-height: 100vh;
  background: linear-gradient(135deg, #2563eb, #1e40af);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.login-card {
  background: white;
  border-radius: 16px;
  padding: 36px 28px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}
.login-card h1 { font-size: 28px; color: #2563eb; text-align: center; margin-bottom: 6px; }
.login-card p  { color: #64748b; text-align: center; margin-bottom: 24px; }

/* Form inputs */
.input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid #cbd5e1;
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 14px;
  outline: none;
  transition: border 0.2s;
}
.input:focus { border-color: #2563eb; }

/* Cards */
.card {
  background: white;
  border-radius: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  padding: 20px;
  margin-bottom: 16px;
}
.card-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Main content */
.main { max-width: 1000px; margin: 0 auto; padding: 16px; }

/* Add stock form */
.add-form {
  display: grid;
  grid-template-columns: 1fr 1fr auto auto auto;
  gap: 10px;
  align-items: center;
}
@media (max-width: 640px) {
  .add-form { grid-template-columns: 1fr 1fr; }
}

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead { background: #f8fafc; }
th { padding: 10px 14px; text-align: left; font-size: 13px; color: #475569; border-bottom: 2px solid #e2e8f0; }
td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
tr:hover td { background: #f8fafc; }

/* Badge */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 13px;
  background: #dbeafe;
  color: #1d4ed8;
}

/* View toggle */
.toggle-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.search-wrap { position: relative; flex: 1; min-width: 160px; }
.search-wrap input { padding-left: 34px; }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; }

/* Godown grid */
.godown-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
.godown-btn {
  padding: 14px 8px;
  border-radius: 10px;
  border: 2px solid #e2e8f0;
  background: white;
  cursor: pointer;
  text-align: center;
  font-weight: 600;
  transition: all 0.2s;
}
.godown-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
.godown-btn small { display: block; font-size: 11px; font-weight: 400; margin-top: 3px; opacity: 0.8; }

/* Tags */
.tag { display: inline-block; background: #dbeafe; color: #1d4ed8; padding: 4px 12px; border-radius: 20px; font-size: 13px; margin: 3px; }

/* Upload section */
.upload-box {
  border: 2px dashed #cbd5e1;
  border-radius: 12px;
  padding: 36px 20px;
  text-align: center;
  cursor: pointer;
  transition: border 0.2s;
}
.upload-box:hover { border-color: #2563eb; }
.upload-icon { font-size: 40px; margin-bottom: 10px; }

/* Mode tabs */
.mode-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.mode-tab {
  flex: 1; padding: 9px; border: none; border-radius: 8px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  background: #f1f5f9; color: #475569;
}
.mode-tab.active { background: #2563eb; color: white; }

/* Alert */
.alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }

/* Actions row */
.actions { display: flex; gap: 6px; }

/* Footer */
.footer { text-align: center; color: #94a3b8; font-size: 13px; margin-top: 24px; padding-bottom: 24px; }

select.input { cursor: pointer; }

    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
